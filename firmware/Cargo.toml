[package]
name = "firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "firmware"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embedded-graphics = "0.8.2"
enumset = "1.1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
u8g2-fonts = "0.8.0"

[build-dependencies]
embuild = "0.33"
